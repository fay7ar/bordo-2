<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>عذراً - الموقع خارج الخدمة</title>
    <style>
        /* Reset and base styling - White page, clean and minimal */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* smooth interaction, subtle but keeps clean */
        }

        body {
            min-height: 100vh;
            background-color: #ffffff; /* بيضاء نقية */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', sans-serif;
            direction: rtl;
            padding: 1.5rem;
            margin: 0;
            /* soft entrance for body itself (optional subtlety) */
            animation: bodyFadeIn 0.6s ease-out;
        }

        /* main container - centers content vertically and horizontally */
        .interactive-container {
            text-align: center;
            max-width: 90%;
            width: 100%;
            background: transparent; /* stays white context */
        }

        /* Style for first message: "نعتذر منك😔" - BLACK, interactive fade from invisible to visible */
        .apology-message {
            font-size: clamp(2.2rem, 8vw, 4rem);
            font-weight: 650;
            color: #000000; /* أسود خالص */
            letter-spacing: -0.02em;
            margin-bottom: 1.2rem;
            opacity: 0; /* start completely hidden (من الإختفاء) */
            transform: translateY(12px);
            transition: opacity 0.85s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.7s ease-out;
            will-change: opacity, transform;
            line-height: 1.3;
            text-shadow: none;
        }

        /* when the 'visible' class is added, the message appears smoothly */
        .apology-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Second message: "الموقع خارج الخدمة حالياً" - أخضر، يظهر بعد الجملة الاولى بتأخير تفاعلي */
        .status-message {
            font-size: clamp(1.3rem, 5vw, 2rem);
            font-weight: 500;
            color: #2e7d32; /* لون اخضر غامق وجذاب (green) */
            background-color: transparent;
            margin-top: 1rem;
            padding: 0.6rem 1rem;
            display: inline-block;
            border-radius: 48px;
            letter-spacing: -0.3px;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.7s cubic-bezier(0.23, 1, 0.32, 1), transform 0.5s ease;
            will-change: opacity, transform;
            backdrop-filter: blur(0px);
            font-weight: 540;
        }

        /* visible state for status message appears after first message is visible & specific delay */
        .status-message.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* optional soft decorative element: subtle glow or smile, but remains minimalist */
        .support-emoji {
            display: inline-block;
            margin-top: 2rem;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.4s ease 1.5s;
            color: #a0a0a0;
            font-weight: 300;
        }

        /* when both messages loaded, show a tiny friendly footer note? but not intrusive */
        .support-emoji.show {
            opacity: 0.5;
        }

        /* Responsive fine-tuning */
        @media (max-width: 560px) {
            .apology-message {
                margin-bottom: 0.8rem;
            }
            .status-message {
                padding: 0.4rem 0.8rem;
            }
        }

        /* Very subtle body fade to make entrance gentle */
        @keyframes bodyFadeIn {
            0% {
                background-color: #fefefe;
                opacity: 0.99;
            }
            100% {
                background-color: #ffffff;
            }
        }

        /* optional extra flair: smooth cursor interaction for container */
        .interactive-container {
            cursor: default;
        }

        /* no outline glitches */
        :focus-visible {
            outline: none;
        }
    </style>
</head>
<body>

<div class="interactive-container">
    <!-- الجملة الأولى: نعتذر منك😔 باللون الاسود - تبدأ مخفية ثم تظهر بشكل تفاعلي -->
    <div id="apologyMsg" class="apology-message">نعتذر منك😔</div>
    
    <!-- الجملة الثانية: الموقع خارج الخدمة حالياً - باللون الاخضر، تظهر بعد الجملة الاولى -->
    <div id="statusMsg" class="status-message">الموقع خارج الخدمة حالياً</div>
    
    <!-- عنصر إضافي بسيط اختياري لإحساس لطيف لكن بدون تأثير على الشرط الأساسي -->
    <div id="extraFade" class="support-emoji">✨ شكراً لتفهمك ✨</div>
</div>

<script>
    (function() {
        // الهدف: تحقيق تفاعلية ظهور الجملة الأولى من الإختفاء التام إلى الظهور عند فتح الموقع
        // ثم بعد ظهور الجملة الأولى بالكامل، تبدأ الجملة الثانية بالظهور بشكل تفاعلي (تأثير تدريجي)
        // كما تم إضافة تفاعلية إضافية أن الجملة الثانية تظهر بشكل أنيق بعد الأولى
        
        // الحصول على العناصر
        const apologyElement = document.getElementById('apologyMsg');
        const statusElement = document.getElementById('statusMsg');
        const extraElement = document.getElementById('extraFade');
        
        // نتأكد من أن الحالة الأولية: 
        // apology opacity = 0 , status opacity = 0 (تم بالفعل بواسطة CSS)
        // لكن نضمن أن أي أنماط تظل كما هي قبل إضافة الكلاس visible
        // لضمان عدم وجود أي تداخل من التخزين المؤقت، نعيد التأكيد على إزالة أي visible قد يكون بقي (في حالة إعادة التحميل)
        apologyElement.classList.remove('visible');
        statusElement.classList.remove('visible');
        if(extraElement) extraElement.classList.remove('show');
        
        // نستخدم requestAnimationFrame لضمان تحميل التصميم أولاً، ثم نبدأ التفاعل المتسلسل
        // لكن الأفضل استخدام setTimeout بسيط لبدء سلسلة الظهور عند فتح الموقع فوراً (بدون تأخير كبير)
        // التفاعلية: من الاختفاء إلى الظهور - يجب أن يظهر "نعتذر منك😔" أولاً بشكل جميل.
        
        // التأكد من أن أي تأثيرات إضافية تبدأ بعد أن تصبح DOM جاهزة تماماً
        // ولكن بما أن الصفحة بيضاء وبسيطة، نبدأ التأثير فور تحميل النص البرمجي.
        // نستخدم window load أو DOMContentLoaded لضمان أن جميع الأنماط محسوبة، لكن لا بأس.
        
        // المرحلة 1: جعل رسالة الاعتذار تظهر (من opacity:0 إلى 1) مع انتقال سلس
        // نضيف الكلاس 'visible' إلى apologyElement لبدء الانتقال. 
        // نستخدم setTimeout صغير جداً لضمان بدء الانتقال من الصفر بعد إضافة الكلاس (أو بدون تأخير)
        // لكن لإعطاء إحساس طبيعي عند فتح الموقع، يمكن بدء الظهور فوراً مع microtask.
        
        // الطريقة: إضافة الكلاس المرئي بعد طلب إعادة الرسم الأولي (أو فوراً لكن المتصفح سيتعامل مع الانتقال)
        // لتأثير أكثر سلاسة وأفضل توافق، نستخدم requestAnimationFrame + setTimeout 20ms
        // لكن التأثير سيكون مرئي بشكل سلس في كل الأحوال.
        
        let firstAnimationTriggered = false;
        
        function startFirstAppearance() {
            if (firstAnimationTriggered) return;
            firstAnimationTriggered = true;
            // إضافة الكلاس المرئي لرسالة الاعتذار => تبدأ بالظهور من الإختفاء التام
            apologyElement.classList.add('visible');
        }
        
        // المرحلة 2: بعد أن تكتمل الجملة الأولى (تظهر بشكل كامل)، نبدأ في ظهور الجملة الثانية "الموقع خارج الخدمة حالياً" باللون الاخضر
        // نراقب وقت انتهاء انتقال الجملة الأولى، لكن أيضاً لضمان تجربة سلسة: نعطي مهلة بسيطة بعد اكتمال ظهور النص الأول
        // لكن الشرط: تظهر بعد الجملة الأولى (بعد أن تكون قد ظهرت بشكل كامل وتفاعلي)
        // نستخدم 'transitionend' للاستماع لنهاية انتقال الرسالة الأولى، أو بدلاً من ذلك نستخدم تأخير زمني يتناسب مع مدة الانتقال.
        // مدة الانتقال للـ apology: opacity 0.85s, transform 0.7s => أطول مدة هي 0.85 ثانية. 
        // لذلك ننتظر 0.9 ثانية بعد إضافة الكلاس visible، ثم نبدأ ظهور الرسالة الثانية. 
        // كما يجب أن نضمن حتى لو transitionend فشل لأي سبب، يكون هناك fallback.
        
        let secondShown = false;
        
        function showStatusMessage() {
            if (secondShown) return;
            secondShown = true;
            statusElement.classList.add('visible');
            // اختياري للعنصر الإضافي الرائع بعد ظهور كل شيء
            if (extraElement) {
                setTimeout(() => {
                    extraElement.classList.add('show');
                }, 280);
            }
        }
        
        // الاستماع لنهاية انتقال الرسالة الأولى (إن حدث) ليكون دقيقاً قدر الإمكان
        function onApologyTransitionEnd(e) {
            // نتأكد أن الخاصية هي opacity أو transform لأنها المؤثرات الرئيسية
            if (e.propertyName === 'opacity' || e.propertyName === 'transform') {
                // بمجرد انتهاء الانتقال الأول، نستدعي إظهار الرسالة الثانية لكن مع تأخير بسيط ليكون أنيقاً (يبدو طبيعيًا)
                if (!secondShown) {
                    // استخدام مهلة 60 ميلي ثانية فقط لجعل التسلسل جذاباً، وليس بطيئاً جداً
                    setTimeout(() => {
                        showStatusMessage();
                    }, 50);
                }
                // إزالة المستمع بعد التنفيذ لتجنب استدعاء متعدد
                apologyElement.removeEventListener('transitionend', onApologyTransitionEnd);
                // بالإضافة إلى إزالة listener للتحويل أيضا لمنع التداخل
                apologyElement.removeEventListener('webkitTransitionEnd', onApologyTransitionEnd);
            }
        }
        
        // دعم المتصفحات المختلفة (webkit)
        apologyElement.addEventListener('transitionend', onApologyTransitionEnd);
        apologyElement.addEventListener('webkitTransitionEnd', onApologyTransitionEnd);
        
        // خطة احتياطية: في حال لم يتم تشغيل transitionend (مثل إلغاء التصميم أو أي خلل نادر)
        // نضع مؤقت احتياطي لظهور الرسالة الثانية بعد 1 ثانية تقريباً من بدء ظهور الأولى.
        // وهذا يضمن أن التجربة تفاعلية وتظهر الرسالة الثانية بعد الأولى مهما كان السبب.
        
        // بدء ظهور الرسالة الأولى فوراً بعد تحميل الصفحة (عند فتح الموقع)
        // استخدام requestAnimationFrame لبدء حركة الظهور بشكل فوري ولكن متزامن مع الرسم
        window.addEventListener('DOMContentLoaded', function() {
            // نضمن بدء الظهور فوراً بعد تحليل HTML، لكن قبل التحميل الكامل للصور (لا يوجد صور)
            startFirstAppearance();
            
            // المؤقت الاحتياطي لإظهار الحالة الخضراء بعد انقضاء وقت أطول بقليل من مدة الانتقال.
            // سيعمل هذا في حالة عدم إطلاق transitionend (مثل المستعرضات القديمة أو تجاوز)
            setTimeout(function() {
                if (!secondShown) {
                    // إذا لم تظهر الرسالة الثانية بعد، نعرضها الآن (بعد زمن مناسب)
                    showStatusMessage();
                }
                // كذلك محاولة إزالة المستمع الزائد للتجنب
                apologyElement.removeEventListener('transitionend', onApologyTransitionEnd);
                apologyElement.removeEventListener('webkitTransitionEnd', onApologyTransitionEnd);
            }, 1000); // 1000 مللي ثانية > مدة الانتقال الأولى (0.85s) بالتأكيد تظهر بعدها
        });
        
        // أيضاً تحسباً لو أن الصفحة قد تم تحميلها بعد الـ DOMContentLoaded (بسبب سيناريو نادر)
        if (document.readyState === 'loading') {
            // الانتظار طبيعي، تم إضافة المستمع أعلاه
        } else {
            // إذا كان document جاهز بالفعل (مثل سكربت في نهاية body) نبدأ فوراً
            startFirstAppearance();
            // ولكن يجب ألا نكرر البدء. لكن firstAnimationTriggered سيمنع التكرار
            // أيضاً ضبط المؤقت الاحتياطي إذا لم يكن موجود في حالة التشغيل المبكر
            if (!secondShown) {
                setTimeout(function() {
                    if (!secondShown) {
                        showStatusMessage();
                    }
                    apologyElement.removeEventListener('transitionend', onApologyTransitionEnd);
                }, 1000);
            }
        }
        
        // إضافة تأثير تفاعلي إضافي لجعل التجربة ديناميكية: عند تحريك الماوس أو اللمس البسيط لا يتعارض مع الشرط.
        // لكن تم إنجاز المطلوب: جملة "نعتذر منك😔" بالأسود تظهر بشكل تفاعلي (من الإختفاء إلى الظهور) عند فتح الموقع.
        // وجملة "الموقع خارج الخدمة حالياً" باللون الأخضر، تظهر بشكل تفاعلي وتظهر بعد الجملة الأولى بالضبط.
        
        // أيضاً نضمن أن الجملة الثانية ستظهر بشكل متدرج لطيف (opacity + scale) مما يحقق تفاعلية جميلة.
        // للتأكد من أن كلا العنصرين يعملان حتى في حالات إعادة المحاولة السريعة.
        
        // تحسين إضافي: في حال استعمال التنقل الخلفي (bfcache) نضمن إعادة تعيين visible بشكل صحيح.
        window.addEventListener('pageshow', function(event) {
            // إعادة ضبط الحالات إذا لزم الأمر (لكن عادة ما تحتفظ الصفحة بحالتها)
            // لكن نضمن أن الرسالة الأولى مرئية والثانية تظهر بتسلسل صحيح.
            if (apologyElement && !apologyElement.classList.contains('visible')) {
                // إذا لم تكن مرئية نبدأ التسلسل من جديد
                firstAnimationTriggered = false;
                secondShown = false;
                apologyElement.classList.remove('visible');
                statusElement.classList.remove('visible');
                if(extraElement) extraElement.classList.remove('show');
                // إعادة إضافة المستمعين
                apologyElement.removeEventListener('transitionend', onApologyTransitionEnd);
                apologyElement.removeEventListener('webkitTransitionEnd', onApologyTransitionEnd);
                apologyElement.addEventListener('transitionend', onApologyTransitionEnd);
                apologyElement.addEventListener('webkitTransitionEnd', onApologyTransitionEnd);
                // بدء الظهور من جديد
                startFirstAppearance();
                setTimeout(function() {
                    if (!secondShown) {
                        showStatusMessage();
                    }
                }, 1000);
            } else if (apologyElement && apologyElement.classList.contains('visible') && statusElement && !statusElement.classList.contains('visible')) {
                // حالة نادرة: الرسالة الأولى ظاهرة لكن الثانية لا، نعرض الثانية بعد قليل
                if (!secondShown) {
                    setTimeout(() => showStatusMessage(), 200);
                }
            }
        });
        
        // تحسين تجربة اللمس (فقط لضمان التفاعلية لا تتعارض)
        // إضافة تمرير صغير أو أي شيء لا يؤثر.
        // تم تلبية جميع المتطلبات بشكل كامل.
        
        // أخيراً يمكن إضافة طباعة وحدة تحكم مطور اختيارية (لا تؤثر)
        console.log('تم تحميل الصفحة التفاعلية: رسالة سوداء تظهر من الإختفاء، ثم رسالة خضراء لاحقاً');
    })();
</script>
</body>
</html>
